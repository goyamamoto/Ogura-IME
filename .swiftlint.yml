# document: https://github.com/realm/SwiftLint
disabled_rules:
  - line_length # If long lines bother you, turn on line wrapping in your editor
  - nesting # How deeply types nest does not matter much
  - file_length # File length does not matter much
  - function_body_length # Function body length does not matter much either
  - type_body_length # Type body length does not matter much either
  - todo # Forbidding TODOs would be the mistake

identifier_name:
  min_length: 1
  max_length: 10000 # Effectively no length limit
  excluded: ["英数|かな"]

type_name:
  min_length: 1
  max_length: 10000 # Effectively no length limit

analyzer_rules:
  - unused_import
  - unused_declaration

opt_in_rules:
  - implicit_return # Prefer implicit return
  - sorted_imports # Keep imports sorted
  - array_init # Prefer Array()
  - conditional_returns_on_newline
  - empty_string # Same as above
  - explicit_init # Do not write .init explicitly
  - first_where # Use .first(where:) instead of .filter { }.first
  - operator_usage_whitespace # Put spaces around operators
  - redundant_nil_coalescing # Disallow ?? nil
  - reduce_into # Prefer reduce(into:)
  - toggle_bool # Prefer .toggle()

included:
  - Ogura
  - Core

excluded:
  - Core/.build
